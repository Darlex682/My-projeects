<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or 'Проекты' }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <div class="brand">Локальная панель проектов</div>
        <nav class="nav">
          <a href="{{ url_for('home') }}">Главная</a>
          <a href="{{ url_for('list_projects') }}">Проекты</a>
          <a href="{{ url_for('create_project') }}">Добавить</a>
          <a href="{{ url_for('dashboard') }}">Дашборд</a>
          <a href="{{ url_for('projects_api') }}" target="_blank">API</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container">Локальная СУБД · Flask + SQLAlchemy · {{ datetime.utcnow().year }}</div>
    </footer>
  </body>
</html>
